<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slow Witnesses</title>
  <style>
    body {
      font-family: sans-serif;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
    }

    .container {
      max-width: 900px;
      margin: 3rem auto;
      padding: 2rem;
      background: #fff;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .media-block {
      display: inline-block;
      width: 300px;
      margin: 2rem auto;
      border: 1px solid #ccc;
      background: #fefefe;
      padding: 0.5rem;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    video, img {
      width: 100%;
      height: auto;
      border-radius: 4px;
    }

    figcaption {
      margin-top: 0.5rem;
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
    }

    .media-grid {
      display: flex;
      justify-content: space-evenly;
      flex-wrap: wrap;
      gap: 2rem;
    }

    h1, p {
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Two Witnesses</h1>
    <p>One slow, one crushed by speed. A snail on the road to Middle River. A ghost named Brooks who couldn’t outrun time.</p>

    <div class="media-grid">
      <figure class="media-block">
        <video controls>
          <source src="adagio/aplasia.MOV" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <figcaption>🐌 Aplasia, encountered only on foot — walking from Martin Station to Middle River.</figcaption>
      </figure>

      
    <div class="media-grid">
      <figure class="media-block">
        <video controls>
          <source src="presto/cars.MOV" type="video/mp4">
          Your browser does not support the video tag.
        </video>
        <figcaption> Dear fellas, I can’t believe how fast things move on the outside. I saw an automobile once when I was a kid, but now they’re everywhere.</figcaption>
      </figure>


      <figure class="media-block">
        <img src="presto/brooks-was-here.GIF" alt="Brooks was here">
        <figcaption>🧓 “Brooks was here.” A man too slow for freedom’s pace after 50 years of stillness.</figcaption>
      </figure>
    </div>

    <p><em>Modernity demands speed. But sometimes the only real thing is what you notice while walking.</em></p>
  </div>
</body>
</html>
